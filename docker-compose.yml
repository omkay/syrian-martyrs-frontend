services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: syrian-martyrs-db
    environment:
      POSTGRES_DB: syrian_martyrs_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: syrian-martyrs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Service
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: syrian-martyrs-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/syrian_martyrs_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-jwt-secret-key-here
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app
      - /app/node_modules
    profiles:
      - production

  # Web Service
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: syrian-martyrs-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - api
    profiles:
      - production

  # Development API Service
  api-dev:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: syrian-martyrs-api-dev
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL="prisma+postgres://accelerate.prisma-data.net/?api_key=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..IWzNb-5xwiU4fO9ijd_EtnOrKjEc5F1E8X9CoIilSk0"
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-jwt-secret-key-here
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app
      - /app/node_modules
    command: npm run dev
    profiles:
      - development

  # Development Web Service
  web-dev:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: syrian-martyrs-web-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - api-dev
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    profiles:
      - development

volumes:
  postgres_data:
  redis_data: