services:
  # ============================================
  # Development Infrastructure
  # ============================================
  
  # PostgreSQL Database (Development)
  postgres-dev:
    image: postgres:15-alpine
    container_name: syrian-martyrs-db-dev
    environment:
      POSTGRES_DB: syrian_martyrs_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - development

  # Redis (Development)
  redis-dev:
    image: redis:7-alpine
    container_name: syrian-martyrs-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - development

  # ============================================
  # Production Infrastructure
  # ============================================
  
  # PostgreSQL Database (Production)
  postgres-prod:
    image: postgres:15-alpine
    container_name: syrian-martyrs-db-prod
    environment:
      POSTGRES_DB: syrian_martyrs_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"  # Different port to avoid conflict with dev
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - production

  # Redis (Production)
  redis-prod:
    image: redis:7-alpine
    container_name: syrian-martyrs-redis-prod
    ports:
      - "6380:6379"  # Different port to avoid conflict with dev
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - production

  # ============================================
  # Development Services
  # ============================================

  # API Service (Development)
  api-dev:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: development
    container_name: syrian-martyrs-api-dev
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis-dev:6379
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      redis-dev:
        condition: service_healthy
    volumes:
      - ./api:/app
      - /app/node_modules
    profiles:
      - development

  # Web Service (Development)
  web-dev:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: development
    container_name: syrian-martyrs-web-dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - API_URL=http://api-dev:3001
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - api-dev
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    profiles:
      - development

  # ============================================
  # Production Services
  # ============================================

  # API Service (Production)
  api-prod:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: production
    container_name: syrian-martyrs-api-prod
    ports:
      - "3002:3001"  # Different port to avoid conflict with dev
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis-prod:6379
      - FRONTEND_URL=http://localhost:3100
    depends_on:
      postgres-prod:
        condition: service_healthy
      redis-prod:
        condition: service_healthy
    profiles:
      - production

  # Web Service (Production)
  web-prod:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: production
    container_name: syrian-martyrs-web-prod
    ports:
      - "3100:3000"  # Different port to avoid conflict with dev
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3002
      - API_URL=http://api-prod:3001
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - api-prod
    profiles:
      - production

volumes:
  postgres_data_dev:
  redis_data_dev:
  postgres_data_prod:
  redis_data_prod:
